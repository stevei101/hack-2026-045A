[package]
name = "org-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Hack 2026-045A — preflight AIVCS org, token, and fetch directory before a 401"
license = "Apache-2.0"
repository = "https://github.com/stevei101/hack-2026-045A"
authors = ["Steven Irvin"]

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
