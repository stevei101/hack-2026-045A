[project]
name = "civicpulse"
version = "0.1.0"
description = "CivicPulse Mesh hazard intake"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
