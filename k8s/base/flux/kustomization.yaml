apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system

resources:
- namespace.yaml
- serviceaccount.yaml
- rbac.yaml

commonLabels:
  app.kubernetes.io/name: flux
  app.kubernetes.io/version: "2.0.0"
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  config.kubernetes.io/version: "0.1.0"
