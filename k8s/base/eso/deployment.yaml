apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets-operator
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets-operator
    app.kubernetes.io/part-of: external-secrets
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets-operator
    spec:
      serviceAccountName: external-secrets-operator
      containers:
      - name: external-secrets-operator
        image: ghcr.io/external-secrets/external-secrets:v0.9.9
        imagePullPolicy: IfNotPresent
        ports:
        - name: webhook
          containerPort: 10250
        - name: prometheus
          containerPort: 8080
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: cluster.local
        - name: POLLER_INTERVAL_MILLISECONDS
          value: "5000"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      nodeSelector:
        kubernetes.io/os: linux
