apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: external-secrets

resources:
- namespace.yaml
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- secretstore.yaml

commonLabels:
  app.kubernetes.io/version: "0.9.9"
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  config.kubernetes.io/version: "0.1.0"
