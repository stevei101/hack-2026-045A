apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: civicpulse
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: civicpulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: civicpulse
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: civicpulse-gemini
